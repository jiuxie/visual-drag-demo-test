name: Deploy to Aliyun

# 触发条件：当代码推送到 main 分支时自动执行
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 20 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖并打包构建
      - name: Install and Build
        run: |
          npm install
          npm run build

      # 4. 通过 SSH 上传文件并部署到阿里云服务器
      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/**"
          target: "/var/www/visual-drag-demo"
          strip_components: 1
          overwrite: true

      # 5. 重启服务器服务（如 Nginx 等，按需开启）
      - name: Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "部署完成，正在更新服务器..."
            # 可以在这里添加重启服务命令，如: sudo systemctl restart nginx
