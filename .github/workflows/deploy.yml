name: Deploy to Aliyun

# 触发条件：当代码推送到 main 分支时自动执行
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 安装 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. 安装依赖并打包构建
      - name: Install and Build
        run: |
          npm install
          npm run build

      # 4. 通过 SSH 部署到阿里云服务器
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 在服务器上创建部署目录（如果不存在）
            mkdir -p /var/www/visual-drag-demo
            # 清空旧文件（防止缓存问题）
            rm -rf /var/www/visual-drag-demo/*
