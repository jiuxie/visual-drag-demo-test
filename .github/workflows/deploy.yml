name: Deploy to Aliyun

# 触发条件：当代码推送到 main 分支时自动执行
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（在 GitHub 临时服务器上）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境（在 GitHub 临时服务器上）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 安装依赖并打包构建（在 GitHub 临时服务器上生成 dist 文件夹）
      - name: Install and Build
        run: |
          npm install
          npm run build

      # 4. 【搬运工】通过 SCP 把打包好的 dist 文件传到阿里云
      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/**"               # 源文件：GitHub 上的 dist 文件夹
          target: "/var/www/visual-drag-demo" # 目标：阿里云上的目录
          strip_components: 1             # 去掉 dist 这层外壳，直接放文件
          overwrite: true                 # 覆盖旧文件

      # 5. 【指挥官】通过 SSH 登录阿里云，修改权限并重启 Nginx
      - name: Restart Nginx via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 把新文件的所有权交给 Nginx 用户（解决 403 报错）
            sudo chown -R www-data:www-data /var/www/visual-drag-demo
            # 重载 Nginx，让新网页立刻生效
            sudo systemctl reload nginx
